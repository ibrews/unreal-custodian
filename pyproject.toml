[project]
name = "unreal-custodian"
version = "0.1.0"
description = "Find and reclaim regeneratable Unreal Engine build caches."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Alex Coulombe Presents" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
custodian = "custodian.cli:main"

[project.urls]
Homepage = "https://github.com/ibrews/unreal-custodian"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["custodian"]
